<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nick’s Digital Atlas</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf2ff;background:#06101f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#183b67 0,#0a1b30 38%,#06101f 75%);padding:24px}.card{width:min(620px,100%);border:1px solid rgba(255,255,255,.12);background:rgba(8,20,38,.86);backdrop-filter:blur(18px);border-radius:24px;padding:28px;box-shadow:0 24px 90px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:clamp(26px,6vw,42px);letter-spacing:-.04em}p{color:#b8c7dc;line-height:1.55;margin:0 0 20px}.bar{height:8px;border-radius:99px;overflow:hidden;background:#16263c}.fill{height:100%;width:35%;border-radius:inherit;background:linear-gradient(90deg,#66d9ff,#93a8ff);animation:load 1.1s ease-in-out infinite alternate}.status{margin-top:12px;font-size:14px;color:#9db0c8}@keyframes load{to{width:92%}}.error{color:#ffd2d8}
</style>
</head>
<body>
<div class="card"><h1>Nick’s Digital Atlas</h1><p>Loading the complete website and tool library.</p><div class="bar"><div class="fill"></div></div><div class="status" id="status">Assembling the Atlas…</div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const get=async path=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`${path} returned ${r.status}`);return r.text()};
  try{
    const shellFiles=[0,1,2].map(i=>`atlas-src/shell-${String(i).padStart(3,'0')}.txt`);
    const dataFiles=Array.from({length:9},(_,i)=>`atlas-src/data-${String(i).padStart(3,'0')}.txt`);
    status.textContent='Loading interface…';
    const shellParts=await Promise.all(shellFiles.map(get));
    status.textContent='Loading 1,834-site library…';
    const dataParts=await Promise.all(dataFiles.map(get));
    const shell=shellParts.join('');
    const data=dataParts.join('');
    if(!shell.includes('__DATA_B64__')) throw new Error('Atlas shell marker missing');
    if(data.length<100000) throw new Error('Atlas database is incomplete');
    const full=shell.replace('__DATA_B64__',data);
    document.open();document.write(full);document.close();
  }catch(err){
    console.error(err);status.className='status error';status.textContent=`Atlas could not load: ${err.message}. Refresh to try again.`;
  }
})();
</script>
</body>
</html>
