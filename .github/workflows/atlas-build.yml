name: Atlas Build Only (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_atlas.py
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-build
          path: dist/
