name: Apply Atlas Brand Visual Redesign

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/atlas-brand-redesign.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Atlas Brand V2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          root=Path('.')
          shell=''.join((root/f'atlas-src/shell-{i:03d}.txt').read_text() for i in range(3))
          data=''.join((root/f'atlas-src/data-{i:03d}.txt').read_text().strip() for i in range(9))
          records=json.loads(gzip.decompress(base64.b64decode(data)))
          assert len(records)==1834
          assert sum(1 for r in records if r[10]=='Live verified')==1529
          assert '__DATA_B64__' in shell
          css=(root/'atlas-src/atlas-brand-v2.css').read_text()
          if 'ATLAS-BRAND-V2' not in shell:
              shell=shell.replace('<meta name="theme-color" content="#0b1020">','<meta name="theme-color" content="#071b1d">',1)
              shell=shell.replace('AI • Tools • Useful Websites','Verified discovery • 1,834 useful resources',1)
              shell=shell.replace('Find the right tool without memorizing the internet.','Your map to the best AI tools & resources.',1)
              shell=shell.replace('A friendly, searchable digital toolbox. Start with what you want to accomplish—the Atlas helps you choose where to go next.','A curated, searchable atlas built to get you from an idea to the right tool faster. Explore by goal, category, verification status, or simply tell the Atlas what you want to accomplish.',1)
              assert '</style>' in shell
              shell=shell.replace('</style>',css+'\n</style>',1)
          assert 'ATLAS-BRAND-V2' in shell
          assert 'Your map to the best AI tools & resources.' in shell
          def split_n(text,n):
              q,r=divmod(len(text),n);out=[];p=0
              for i in range(n):
                  size=q+(1 if i<r else 0);out.append(text[p:p+size]);p+=size
              assert ''.join(out)==text
              return out
          for i,part in enumerate(split_n(shell,3)):
              (root/f'atlas-src/shell-{i:03d}.txt').write_text(part)
          bundle=shell.replace('__DATA_B64__',data)
          (root/'atlas-bundle.html').write_text(bundle)
          report={'tool_count':1834,'bundle_bytes':len(bundle.encode()),'data_b64_bytes':len(data.encode()),'sha256':hashlib.sha256(bundle.encode()).hexdigest(),'visual_theme':'Atlas Brand V2 — custom exploration identity + premium minimal UI','live_verified':1529}
          (root/'atlas-build-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Commit redesign to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-src/shell-*.txt atlas-bundle.html atlas-build-report.json
          if git diff --cached --quiet; then
            echo "Atlas Brand V2 already current"
          else
            git commit -m "Redesign Atlas with custom premium visual system"
            git push origin HEAD:main
          fi

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Publish redesigned Atlas
        shell: bash
        run: |
          mkdir -p public/atlas
          cp atlas-bundle.html public/atlas/index.html
          cp atlas-build-report.json public/atlas/build-report.json
          if [ -f atlas-audit-summary.json ]; then cp atlas-audit-summary.json public/atlas/audit-summary.json; fi
          touch public/.nojekyll
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A atlas .nojekyll
          if git diff --cached --quiet; then
            echo "Redesigned Atlas already published"
          else
            git commit -m "Publish Atlas Brand V2 redesign"
            git push origin HEAD:gh-pages
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for redesigned production
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
        run: |
          python - <<'PY'
          import os,time,urllib.request
          url=os.environ['ATLAS_URL']
          for i in range(48):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Atlas-Design-QA/2.0'})
                  html=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','replace')
                  if 'ATLAS-BRAND-V2' in html and 'Your map to the best AI tools & resources.' in html:
                      print(f'Redesigned production current after {i*5}s')
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Redesigned production did not become current')
          PY

      - name: Run comprehensive live QA
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
        run: node qa/atlas-live-qa.js

      - name: Run visual smoke QA
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
        run: |
          mkdir -p qa-artifacts/brand-v2
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height] of [['desktop',1440,1100],['mobile',390,844]]){
              const page=await browser.newPage({viewport:{width,height}});
              const res=await page.goto(process.env.ATLAS_URL,{waitUntil:'networkidle',timeout:60000});
              if(!res||res.status()!==200)throw new Error('Atlas HTTP failure');
              await page.waitForFunction(()=>document.querySelector('#statVerified')?.textContent==='1,529');
              const hero=page.locator('.hero');
              const bg=await hero.evaluate(el=>getComputedStyle(el).backgroundImage);
              const radius=parseFloat(await hero.evaluate(el=>getComputedStyle(el).borderRadius));
              const title=await hero.locator('h1').innerText();
              if(!bg.includes('gradient')||radius<20||!title.includes('Your map to the best'))throw new Error(`${name} visual system not applied`);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>1)throw new Error(`${name} horizontal overflow ${overflow}`);
              await page.screenshot({path:`qa-artifacts/brand-v2/${name}.png`,fullPage:true});
              await page.close();
              console.log(`PASS | ${name} Atlas Brand V2`);
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Upload redesign QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: atlas-brand-v2-qa
          path: qa-artifacts/brand-v2/
          retention-days: 14
