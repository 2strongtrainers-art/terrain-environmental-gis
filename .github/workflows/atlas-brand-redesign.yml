name: Apply Atlas Brand Visual Redesign

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/atlas-brand-redesign.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply custom Atlas + premium minimal visual system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          root=Path('.')
          shell=''.join((root/f'atlas-src/shell-{i:03d}.txt').read_text() for i in range(3))
          data=''.join((root/f'atlas-src/data-{i:03d}.txt').read_text().strip() for i in range(9))
          records=json.loads(gzip.decompress(base64.b64decode(data)))
          assert len(records)==1834
          assert sum(1 for r in records if r[10]=='Live verified')==1529
          assert '__DATA_B64__' in shell
          assert 'ATLAS-BRAND-V2' not in shell, 'Redesign already applied'

          shell=shell.replace('<meta name="theme-color" content="#0b1020">','<meta name="theme-color" content="#071b1d">',1)
          shell=shell.replace('AI • Tools • Useful Websites','Verified discovery • 1,834 useful resources',1)
          shell=shell.replace('Find the right tool without memorizing the internet.','Your map to the best AI tools & resources.',1)
          shell=shell.replace('A friendly, searchable digital toolbox. Start with what you want to accomplish—the Atlas helps you choose where to go next.','A curated, searchable atlas built to get you from an idea to the right tool faster. Explore by goal, category, verification status, or simply tell the Atlas what you want to accomplish.',1)

          redesign=r'''
/* ATLAS-BRAND-V2 — custom Atlas identity with premium minimal restraint */
:root{
 --bg:#f4f8f7;--panel:#ffffff;--panel2:#f8fbfa;--ink:#0c1b1c;--muted:#617274;--line:rgba(10,72,75,.12);
 --navy:#06181a;--blue:#0f9d9a;--blue2:#67e8df;--green:#0e9f6e;--amber:#c47a14;--red:#c93c37;
 --purple:#2f7f87;--pink:#1b858d;--shadow:0 20px 60px rgba(6,55,58,.09);--r:20px;--max:1240px
}
html{background:#f4f8f7}
body{
 background:
  radial-gradient(circle at 10% -10%,rgba(103,232,223,.12),transparent 25%),
  radial-gradient(circle at 95% 18%,rgba(15,157,154,.07),transparent 22%),
  var(--bg);
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility
}
::selection{background:#b9f3ee;color:#062a2d}
.topbar{background:rgba(5,24,26,.91);border-bottom:1px solid rgba(141,245,235,.11);box-shadow:0 8px 30px rgba(4,33,35,.08)}
.nav{height:72px}
.brand{font-weight:760;letter-spacing:-.03em}
.brandmark{position:relative;width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#0c8f8d,#61ddd5);box-shadow:0 10px 28px rgba(52,211,203,.22);border:1px solid rgba(255,255,255,.22)}
.navbtn{color:#cbd9da;border:1px solid transparent;transition:background .18s ease,border-color .18s ease,color .18s ease}
.navbtn:hover,.navbtn.active{background:rgba(101,232,223,.09);border-color:rgba(101,232,223,.12);color:#f7ffff}
.menu{border-color:rgba(101,232,223,.22);border-radius:12px}
.wrap{padding-bottom:76px}
.hero{
 min-height:430px;display:flex;flex-direction:column;justify-content:center;margin:30px 0 22px;padding:68px 58px;border-radius:32px;
 background:
  radial-gradient(circle at 79% 23%,rgba(90,235,224,.18),transparent 26%),
  radial-gradient(circle at 63% 86%,rgba(18,142,144,.22),transparent 34%),
  linear-gradient(125deg,#061719 0%,#08272a 48%,#0a3537 100%);
 border:1px solid rgba(125,238,229,.15);box-shadow:0 28px 75px rgba(5,49,52,.18);isolation:isolate
}
.hero:before{
 content:"";position:absolute;z-index:-1;right:-3%;bottom:-13%;width:63%;height:88%;opacity:.95;
 background:linear-gradient(155deg,rgba(103,232,223,.34),rgba(12,93,98,.13) 43%,rgba(5,25,28,.1) 74%);
 clip-path:polygon(0 100%,18% 73%,30% 45%,43% 68%,58% 26%,68% 52%,80% 37%,100% 63%,100% 100%);
 filter:drop-shadow(0 -10px 28px rgba(64,220,211,.08));pointer-events:none
}
.hero:after{
 content:"";position:absolute;z-index:-1;right:0;top:0;width:58%;height:100%;border-radius:0;
 background-image:radial-gradient(circle,rgba(126,239,230,.65) 1.3px,transparent 1.6px);
 background-size:42px 42px;background-position:10px 4px;opacity:.42;
 -webkit-mask-image:linear-gradient(to left,#000 20%,rgba(0,0,0,.72) 60%,transparent 100%);mask-image:linear-gradient(to left,#000 20%,rgba(0,0,0,.72) 60%,transparent 100%);pointer-events:none
}
.hero>.eyebrow,.hero>h1,.hero>p,.hero>.actions{position:relative;z-index:2}
.eyebrow{display:inline-flex;width:max-content;max-width:100%;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800;color:#9df2eb;background:rgba(92,220,211,.08);border:1px solid rgba(115,239,229,.15);padding:7px 10px;border-radius:999px}
.hero h1{font-size:clamp(42px,5.8vw,72px);line-height:.98;max-width:700px;margin:18px 0 18px;letter-spacing:-.06em;font-weight:780}
.hero p{font-size:17px;line-height:1.7;max-width:670px;color:#c8dedf;margin-bottom:28px}
.btn{border-radius:12px;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:#63e3db;color:#062426;box-shadow:0 10px 26px rgba(53,211,202,.2)}
.btn.ghost{background:rgba(255,255,255,.055);color:#efffff;border-color:rgba(154,242,235,.18);backdrop-filter:blur(12px)}
.btn.blue{background:#0b8e8c;color:#fff;box-shadow:0 8px 20px rgba(15,157,154,.14)}
.btn.soft{background:#e8f8f6;color:#0a6667}
.btn.outline{background:#fff;border-color:rgba(9,77,80,.15);color:#294648}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #78ded7;outline-offset:2px}
.stats{gap:13px;margin:20px 0 42px}
.stat{position:relative;overflow:hidden;border-color:rgba(7,73,76,.1);border-radius:18px;padding:19px 20px;box-shadow:0 8px 25px rgba(8,61,64,.035)}
.stat:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,#0f9d9a,#72e4dc);opacity:.8}
.stat b{font-size:28px;color:#102f31}.stat span{color:#6a797b}
.section{margin:42px 0}.sectionhead h2{font-size:30px;color:#102b2d}.sectionhead p{color:#687a7c}
.grid{gap:15px}
.card{border-color:rgba(7,73,76,.1);border-radius:20px;padding:21px;box-shadow:0 7px 24px rgba(8,61,64,.025);background:rgba(255,255,255,.96)}
.card.click:hover{transform:translateY(-3px);border-color:rgba(15,157,154,.36);box-shadow:0 18px 45px rgba(8,73,76,.09)}
.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:#eaf8f6;border:1px solid #d5f0ed}
.card h3{color:#153638}
.callout{border-color:#c6ece8;background:#effaf8}.callout.green{background:#effaf6;border-color:#ccecdf}.callout.purple{background:#eef8f8;border-color:#cfe7e7}.callout.gray{background:#f8faf9;border-color:#e1e9e8}
.steps{gap:15px}.step{border-color:rgba(7,73,76,.1);border-radius:19px}.num{background:#e8f8f6;color:#0a7474}
.command{border:1px solid rgba(15,157,154,.18);background:linear-gradient(145deg,#f1fbfa,#fff 68%);border-radius:24px;padding:23px;box-shadow:0 14px 42px rgba(7,73,76,.055)}
.commandbox input{border-color:rgba(9,75,78,.18);border-radius:13px;background:#fff}.suggestion{border-color:rgba(9,75,78,.12)}
.libraryHero{padding:34px 0 13px}.libraryHero h1,.pagehead h1{color:#102b2d;font-weight:760}
.searchbar{top:72px;background:rgba(244,248,247,.91);border-bottom-color:rgba(7,73,76,.07)}
.control{border-color:rgba(7,73,76,.15);border-radius:12px;color:#2e4d4f;box-shadow:0 2px 6px rgba(8,61,64,.02)}
.chip{border-color:rgba(7,73,76,.13);color:#4d6769}.chip.active{background:#0a3437;color:#fff;border-color:#0a3437}
.tools{gap:14px}.tool{border-color:rgba(7,73,76,.105);border-radius:19px;padding:18px;box-shadow:0 7px 24px rgba(8,61,64,.025);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.tool:hover{transform:translateY(-2px);border-color:rgba(15,157,154,.27);box-shadow:0 17px 38px rgba(8,73,76,.075)}
.favicon{background:#eaf8f6;color:#0b7778;border:1px solid #d8efed}.tool h3{color:#153638}.domain{color:#849395}.tool p{color:#637577}
.badge.live{background:#e8f8ef;color:#08734f}.badge.free{background:#eaf7f8;color:#0a7276}.badge.ai{background:#edf7f7;color:#276a6d}.badge.pending{background:#fff7e7;color:#98600e}.badge.blocked{background:#f0f4f4;color:#4b6163}
.pagination button{border-color:rgba(7,73,76,.13);border-radius:11px}
.category,.sourcecard,.quality .panel,.faq details,.modalbox{border-color:rgba(7,73,76,.105);box-shadow:0 9px 30px rgba(8,61,64,.035)}
.category:hover{border-color:rgba(15,157,154,.3)}
.sourcecard a{color:#087f80}
.quality table td{border-bottom-color:rgba(7,73,76,.1)}
.modal{background:rgba(4,26,28,.62);backdrop-filter:blur(4px)}
.footer{border-top-color:rgba(7,73,76,.1);color:#6d7e80}.footer b{color:#254547}
.mobilepanel{top:72px;background:#071b1d;border-top-color:rgba(101,232,223,.1)}
@media(max-width:680px){
 .hero{min-height:410px;padding:44px 25px 50px;margin-top:16px;border-radius:24px}.hero h1{font-size:46px;max-width:95%}.hero p{font-size:15.5px;line-height:1.65}.hero:before{right:-26%;width:92%;height:60%;opacity:.7}.hero:after{width:100%;opacity:.22}.searchbar{top:72px}.stat{padding:15px}.stat b{font-size:23px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
'''
          assert '</style>' in shell
          shell=shell.replace('</style>',redesign+'\n</style>',1)

          def split_n(text,n):
              q,r=divmod(len(text),n);out=[];p=0
              for i in range(n):
                  s=q+(1 if i<r else 0);out.append(text[p:p+s]);p+=s
              assert ''.join(out)==text
              return out

          for i,part in enumerate(split_n(shell,3)):
              (root/f'atlas-src/shell-{i:03d}.txt').write_text(part)

          bundle=shell.replace('__DATA_B64__',data)
          (root/'atlas-bundle.html').write_text(bundle)
          report={
            'tool_count':1834,
            'bundle_bytes':len(bundle.encode()),
            'data_b64_bytes':len(data.encode()),
            'sha256':hashlib.sha256(bundle.encode()).hexdigest(),
            'visual_theme':'Atlas Brand V2 — custom exploration identity + premium minimal UI',
            'live_verified':1529
          }
          (root/'atlas-build-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Commit redesign to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-src/shell-*.txt atlas-bundle.html atlas-build-report.json
          git commit -m "Redesign Atlas with custom premium visual system"
          git push origin HEAD:main

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Publish redesigned Atlas directly
        shell: bash
        run: |
          mkdir -p public/atlas
          cp atlas-bundle.html public/atlas/index.html
          cp atlas-build-report.json public/atlas/build-report.json
          if [ -f atlas-audit-summary.json ]; then cp atlas-audit-summary.json public/atlas/audit-summary.json; fi
          touch public/.nojekyll
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/index.html atlas/build-report.json atlas/audit-summary.json .nojekyll
          git commit -m "Publish Atlas Brand V2 redesign"
          git push origin HEAD:gh-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for redesigned production
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
        run: |
          python - <<'PY'
          import os,time,urllib.request
          url=os.environ['ATLAS_URL']
          for i in range(48):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Atlas-Design-QA/2.0'})
                  html=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','replace')
                  if 'ATLAS-BRAND-V2' in html and 'Your map to the best AI tools &amp; resources.' in html:
                      print(f'Redesigned production current after {i*5}s');break
              except Exception: pass
              time.sleep(5)
          else: raise SystemExit('Redesigned production did not become current')
          PY

      - name: Run comprehensive live QA
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
        run: node qa/atlas-live-qa.js

      - name: Run visual-system smoke QA and screenshots
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
        run: |
          mkdir -p qa-artifacts/brand-v2
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height] of [['desktop',1440,1100],['mobile',390,844]]){
              const page=await browser.newPage({viewport:{width,height}});
              const res=await page.goto(process.env.ATLAS_URL,{waitUntil:'networkidle',timeout:60000});
              if(!res||res.status()!==200)throw new Error('Atlas HTTP failure');
              await page.waitForFunction(()=>document.querySelector('#statVerified')?.textContent==='1,529');
              const hero=page.locator('.hero');
              const bg=await hero.evaluate(el=>getComputedStyle(el).backgroundImage);
              const radius=await hero.evaluate(el=>getComputedStyle(el).borderRadius);
              const title=await hero.locator('h1').innerText();
              if(!bg.includes('gradient')||parseFloat(radius)<20||!title.includes('Your map to the best'))throw new Error(`${name} visual system not applied`);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>1)throw new Error(`${name} horizontal overflow ${overflow}`);
              await page.screenshot({path:`qa-artifacts/brand-v2/${name}.png`,fullPage:true});
              await page.close();
              console.log(`PASS | ${name} Atlas Brand V2`);
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Upload redesign QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: atlas-brand-v2-qa
          path: qa-artifacts/brand-v2/
          retention-days: 14
