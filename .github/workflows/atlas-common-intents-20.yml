name: Atlas 20 Common Intent Test

on:
  workflow_dispatch:

jobs:
  common-intents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Run 20 live common-intent tests
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-common-intents-20.js
      - name: Upload intent test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-common-intents-20
          path: intent-qa/
          retention-days: 30
