name: Atlas Intent + Multimedia V4

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_atlas_intent_v32.py
      - scripts/apply_atlas_multimedia_v4.py
      - scripts/apply_atlas_multimedia_v41.py
      - qa/atlas-common-intents-20.js
      - qa/atlas-intent-stress-60.js
      - qa/atlas-watch-multimedia.js
      - qa/atlas-live-qa.js
      - .github/workflows/atlas-intent-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply current Atlas engines idempotently
        run: |
          python scripts/apply_atlas_intent_v32.py
          python scripts/apply_atlas_multimedia_v4.py
          python scripts/apply_atlas_multimedia_v41.py

      - name: Commit production source and synchronized QA
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-src/shell-*.txt atlas-src/data-*.txt atlas-bundle.html atlas-build-report.json qa/atlas-live-qa.js qa/atlas-common-intents-20.js qa/atlas-intent-stress-60.js qa/atlas-watch-multimedia.js
          if git diff --cached --quiet; then
            echo "Atlas V4 source already current"
          else
            git commit -m "Ship Atlas Watch and Multimedia V4.1"
            git push origin HEAD:main
          fi

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 0

      - name: Publish Atlas V4.1
        shell: bash
        run: |
          mkdir -p public/atlas
          cp atlas-bundle.html public/atlas/index.html
          cp atlas-build-report.json public/atlas/build-report.json
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/index.html atlas/build-report.json
          if git diff --cached --quiet; then
            echo "Published Atlas already current"
          else
            git commit -m "Publish Atlas Watch and Multimedia V4.1"
            git push origin HEAD:gh-pages
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser driver
        run: npm install --no-save playwright@1.55.0

      - name: Wait for production V4.1
        env:
          URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
        run: |
          python - <<'PY'
          import os,time,urllib.request
          u=os.environ['URL']
          for i in range(72):
              try:
                  req=urllib.request.Request(u,headers={'Cache-Control':'no-cache','User-Agent':'Atlas-Multimedia-V41-QA'})
                  h=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','replace')
                  if 'ATLAS-MULTIMEDIA-V41' in h and '1,846' in h and 'id="view-watch"' in h:
                      print('V4.1 live after',i*5,'seconds');break
              except Exception as e: print('wait',e)
              time.sleep(5)
          else: raise SystemExit('V4.1 production marker not found')
          PY

      - name: Run strict 20 common-intent benchmark
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-common-intents-20.js

      - name: Run 60-query stress benchmark
        continue-on-error: true
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-intent-stress-60.js

      - name: Run Watch and Multimedia QA
        continue-on-error: true
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-watch-multimedia.js

      - name: Run full production regression
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-live-qa.js

      - name: Certification gate
        run: |
          python - <<'PY'
          import json
          stress=json.load(open('intent-qa/atlas-intent-stress-60.json'))
          watch=json.load(open('watch-qa/atlas-watch-report.json'))
          live=json.load(open('qa-artifacts/atlas-live-qa-report.json'))
          s=stress.get('summary',{})
          if s.get('structural')!=60 or s.get('relevant')!=60 or s.get('jsErrors')!=0:
              raise SystemExit(f"Stress benchmark not certified: {s}")
          if len(watch.get('queries',[]))!=8 or sum(1 for x in watch['queries'] if x.get('ok'))!=8 or watch.get('errors'):
              raise SystemExit('Watch QA not certified')
          if live.get('failed')!=0 or live.get('page_errors') or live.get('request_failures'):
              raise SystemExit('Full regression not certified')
          print('CERTIFIED: 20/20 core, 60/60 stress, 8/8 watch queries, full regression green')
          PY

      - name: Upload V4 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-multimedia-v41-evidence
          path: |
            intent-qa/
            watch-qa/
            qa-artifacts/
          retention-days: 30