name: Atlas Discovery V5 Production Gate

on:
  push:
    branches: [main]
    paths:
      - atlas-upgrade.js
      - atlas-bundle.html
      - analytics/atlas-behavior-ranking-policy.json
      - scripts/apply_atlas_intent_v32.py
      - scripts/apply_atlas_multimedia_v4.py
      - scripts/apply_atlas_multimedia_v41.py
      - scripts/apply_atlas_discovery_v5_search.py
      - qa/atlas-common-intents-20.js
      - qa/atlas-intent-stress-60.js
      - qa/atlas-expanded-benchmark-220.js
      - qa/atlas-watch-multimedia.js
      - qa/atlas-live-qa.js
      - .github/workflows/atlas-intent-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-production-gate
  cancel-in-progress: true

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build current Atlas core in working tree
        run: |
          python scripts/apply_atlas_intent_v32.py
          python scripts/apply_atlas_multimedia_v4.py
          python scripts/apply_atlas_multimedia_v41.py
          python scripts/apply_atlas_discovery_v5_search.py
          test -s atlas-bundle.html
          grep -q 'ATLAS-INTENT-V32' atlas-bundle.html
          grep -q 'ATLAS-MULTIMEDIA-V41' atlas-bundle.html
          grep -q 'ATLAS-DISCOVERY-V5-SEARCH' atlas-bundle.html
          grep -q '1,846' atlas-bundle.html

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 0

      - name: Publish monolithic Atlas core plus V5 discovery layer
        shell: bash
        run: |
          mkdir -p public/atlas
          python - <<'PY'
          from pathlib import Path
          core=Path('atlas-bundle.html').read_text()
          tag='<script src="../atlas-upgrade.js?v=20260904-v5" defer></script>'
          if tag not in core:
              if '</body>' not in core: raise SystemExit('Atlas bundle has no closing body tag')
              core=core.replace('</body>',tag+'</body>',1)
          Path('public/atlas/index.html').write_text(core)
          PY
          cp atlas-upgrade.js public/atlas-upgrade.js
          cp atlas-build-report.json public/atlas/build-report.json
          touch public/.nojekyll
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/index.html atlas/build-report.json atlas-upgrade.js .nojekyll
          if git diff --cached --quiet; then
            echo "Published Atlas candidate already current"
          else
            git commit -m "Publish Atlas Discovery V5 candidate"
            git fetch origin gh-pages
            git rebase origin/gh-pages
            git push origin HEAD:gh-pages
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser driver
        run: npm install --no-save playwright@1.55.0

      - name: Wait for production V5
        env:
          URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          UPGRADE: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas-upgrade.js?v=20260904-v5
        run: |
          python - <<'PY'
          import os,time,urllib.request
          for i in range(72):
              try:
                  def get(u):
                      req=urllib.request.Request(u,headers={'Cache-Control':'no-cache','User-Agent':'Atlas-V5-QA'})
                      return urllib.request.urlopen(req,timeout=15).read().decode('utf-8','replace')
                  page=get(os.environ['URL']); upgrade=get(os.environ['UPGRADE'])
                  if '1,846' in page and 'ATLAS-MULTIMEDIA-V41' in page and 'ATLAS-DISCOVERY-V5-SEARCH' in page and '20260904-v5' in page and "atlas_discovery_version:'5.0'" in upgrade and 'PLAYBOOKS' in upgrade:
                      print('Atlas V5 live after',i*5,'seconds');break
              except Exception as e: print('wait',e)
              time.sleep(5)
          else: raise SystemExit('Atlas V5 production candidate not found')
          PY

      - name: Run strict 20 core-intent benchmark
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-common-intents-20.js

      - name: Run legacy 60-query stress benchmark
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-intent-stress-60.js

      - name: Run strict 220-query expanded benchmark and target-mobile smoke
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-expanded-benchmark-220.js

      - name: Run Watch and Multimedia QA
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-watch-multimedia.js

      - name: Run full production regression
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-live-qa.js

      - name: V5 certification gate
        run: |
          python - <<'PY'
          import json
          core=json.load(open('intent-qa/atlas-common-intents-20.json'))
          stress=json.load(open('intent-qa/atlas-intent-stress-60.json'))
          expanded=json.load(open('expanded-qa/atlas-expanded-benchmark-220.json'))
          watch=json.load(open('watch-qa/atlas-watch-report.json'))
          live=json.load(open('qa-artifacts/atlas-live-qa-report.json'))
          c=core.get('summary',{}); s=stress.get('summary',{}); e=expanded.get('summary',{})
          if c.get('structuralPassed')!=20 or c.get('relevancePassed')!=20 or c.get('jsErrors'):
              raise SystemExit(f"Core benchmark not certified: {c}")
          if s.get('structural')!=60 or s.get('relevant')!=60 or s.get('jsErrors')!=0:
              raise SystemExit(f"Stress benchmark not certified: {s}")
          if e.get('total')!=220 or e.get('structural')!=220 or e.get('relevanceRate',0)<0.97:
              raise SystemExit(f"Expanded relevance gate failed: {e}")
          if e.get('jsErrors') or e.get('sameOriginFailures') or e.get('overflowRuns'):
              raise SystemExit(f"Expanded production/mobile gate failed: {e}")
          if len(watch.get('queries',[]))!=8 or sum(1 for x in watch['queries'] if x.get('ok'))!=8 or watch.get('errors'):
              raise SystemExit('Watch QA not certified')
          if live.get('failed')!=0 or live.get('page_errors') or live.get('request_failures'):
              raise SystemExit('Full regression not certified')
          print(f"CERTIFIED V5: core 20/20; stress 60/60; expanded {e['relevant']}/220 ({e['relevanceRate']*100:.2f}%); 3 mobile widths no overflow; Watch 8/8; regression green")
          PY

      - name: Upload V5 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-discovery-v5-evidence
          path: |
            intent-qa/
            expanded-qa/
            watch-qa/
            qa-artifacts/
            analytics/atlas-behavior-ranking-policy.json
          retention-days: 30
