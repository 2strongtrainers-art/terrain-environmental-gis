name: Atlas V6 Build, Verify, Publish

on:
  push:
    branches: [main]
    paths:
      - atlas-src/**
      - atlas-static/**
      - atlas-upgrade.js
      - atlas-mobile-beginner.js
      - scripts/**
      - qa/**
      - .github/workflows/atlas-intent-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-production-publish
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build candidate and verify reproducibility
        run: |
          python scripts/build_atlas.py
          python scripts/build_atlas.py --out /tmp/atlas-repeat
          diff -r dist /tmp/atlas-repeat
      - name: Install browser test driver
        run: npm install --no-save playwright@1.55.0
      - name: Serve candidate
        run: python -m http.server 8765 --directory dist > /tmp/atlas-http.log 2>&1 &
      - name: Verify new navigation, IDs, search links and four mobile widths
        env: { ATLAS_URL: 'http://127.0.0.1:8765/atlas/', CHROME_PATH: /usr/bin/google-chrome }
        run: node qa/atlas-navigation-v6.js
      - name: Verify 20 core search intents
        env: { ATLAS_URL: 'http://127.0.0.1:8765/atlas/', CHROME_PATH: /usr/bin/google-chrome }
        run: node qa/atlas-common-intents-20.js
      - name: Verify 60 search variations
        env: { ATLAS_URL: 'http://127.0.0.1:8765/atlas/', CHROME_PATH: /usr/bin/google-chrome }
        run: node qa/atlas-intent-stress-60.js
      - name: Verify 220 search variations
        env: { ATLAS_URL: 'http://127.0.0.1:8765/atlas/', CHROME_PATH: /usr/bin/google-chrome }
        run: node qa/atlas-expanded-benchmark-220.js
      - name: Verify Watch and existing functionality
        env: { ATLAS_URL: 'http://127.0.0.1:8765/atlas/', CHROME_PATH: /usr/bin/google-chrome }
        run: |
          mkdir -p watch-qa qa-artifacts
          node qa/atlas-watch-multimedia.js
          node qa/atlas-live-qa.js
      - name: Enforce search and regression gates before publishing
        run: |
          python - <<'PY'
          import json
          def read(p): return json.load(open(p))
          n=read('navigation-qa/report.json')
          assert not n.get('failure') and not n['errors'], n
          c=read('intent-qa/atlas-common-intents-20.json')['summary']
          s=read('intent-qa/atlas-intent-stress-60.json')['summary']
          e=read('expanded-qa/atlas-expanded-benchmark-220.json')['summary']
          r=read('qa-artifacts/atlas-live-qa-report.json')
          assert c['structuralPassed']==20 and c['relevancePassed']==20 and not c['jsErrors'], c
          assert s['structural']==60 and s['relevant']==60 and not s['jsErrors'], s
          assert e['structural']==220 and e['relevanceRate']>=.97 and not e['jsErrors'] and not e['overflowRuns'], e
          assert not r['failed'] and not r['page_errors'] and not r['request_failures'], r
          print('All candidate gates passed; publishing the verified files.')
          PY
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 0
      - name: Publish verified Atlas files while preserving the GIS site
        run: |
          cp -R dist/. public/
          touch public/.nojekyll
          cd public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas atlas-upgrade.js atlas-mobile-beginner.js .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Atlas V6 search and topic indexes'
            git push origin HEAD:gh-pages
          fi
      # GitHub's existing Pages integration deploys gh-pages. It is the
      # environment-approved release branch; main never deploys directly.
      - name: Verify live production navigation
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
          QA_OUTPUT: navigation-qa/live
        run: |
          python - <<'PY'
          import json,time,urllib.request
          expected=json.load(open('dist/atlas/build-report.json'))['sha256']
          for _ in range(30):
            try:
              u='https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/build-report.json'
              r=json.load(urllib.request.urlopen(u+'?v='+expected,timeout=15))
              if r.get('sha256')==expected: break
            except Exception: pass
            time.sleep(5)
          else: raise SystemExit('Production has not returned the expected build')
          PY
          node qa/atlas-navigation-v6.js
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v6-evidence
          path: |
            navigation-qa/
            intent-qa/
            expanded-qa/
            watch-qa/
            qa-artifacts/
            dist/atlas/build-report.json
          retention-days: 30
