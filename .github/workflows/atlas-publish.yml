# Manual fallback publisher for Nick's Digital Atlas.
# Normal production releases are owned by Atlas Discovery V5 Production Gate,
# which deploys the candidate and then runs live production QA before certification.
name: Publish Nick's Digital Atlas (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-production-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 0

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 0

      - name: Install Atlas into gh-pages
        shell: bash
        run: |
          rm -rf public/atlas public/atlas-src
          mkdir -p public/atlas
          cp source/atlas/index.html public/atlas/index.html
          cp -R source/atlas-src public/atlas-src
          cp source/atlas-upgrade.js public/atlas-upgrade.js
          cp source/atlas-build-report.json public/atlas/build-report.json
          touch public/.nojekyll

      - name: Commit published Atlas safely
        shell: bash
        run: |
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/index.html atlas-src atlas-upgrade.js atlas/build-report.json .nojekyll
          if git diff --cached --quiet; then
            echo "Atlas already published"
          else
            git commit -m "Manual fallback publish of Nick's Digital Atlas"
            git fetch origin gh-pages
            git rebase origin/gh-pages
            git push origin HEAD:gh-pages
          fi
