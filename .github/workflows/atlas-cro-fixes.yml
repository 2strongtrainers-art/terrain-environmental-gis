name: Atlas CRO V2 Deploy and Verify

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/atlas-cro-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply CRO V2 changes
        run: python scripts/apply_atlas_cro_v2.py

      - name: Commit improved source to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-src/shell-*.txt atlas-bundle.html atlas-build-report.json atlas-static qa/atlas-live-qa.js
          if git diff --cached --quiet; then
            echo "Main source already current"
          else
            git commit -m "Ship Atlas CRO V2 conversion and discovery system"
            git push origin HEAD:main
          fi

      - name: Checkout gh-pages without touching terrain root
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 0

      - name: Publish Atlas to gh-pages
        shell: bash
        run: |
          mkdir -p public/atlas
          cp atlas-bundle.html public/atlas/index.html
          cp atlas-build-report.json public/atlas/build-report.json
          rm -rf public/atlas/collections public/atlas/partners
          cp -R atlas-static/collections public/atlas/collections
          cp -R atlas-static/partners public/atlas/partners
          cp atlas-static/sitemap.xml public/atlas/sitemap.xml
          touch public/.nojekyll
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/index.html atlas/build-report.json atlas/collections atlas/partners atlas/sitemap.xml .nojekyll
          if git diff --cached --quiet; then
            echo "Published Atlas already current"
          else
            git commit -m "Publish Atlas CRO V2"
            git push origin HEAD:gh-pages
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser audit tooling
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2 lighthouse@12.8.2

      - name: Wait for live production marker
        shell: bash
        env:
          URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
        run: |
          python - <<'PY'
          import os,time,urllib.request
          url=os.environ['URL']
          last=''
          for i in range(72):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Atlas-CRO-V2-QA/1.0','Cache-Control':'no-cache'})
                  html=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','replace')
                  if 'ATLAS-CRO-V2' in html and 'Browse all 1,834 tools' in html:
                      print('Production updated after',i*5,'seconds')
                      break
                  last='old production snapshot'
              except Exception as e:
                  last=str(e)
              time.sleep(5)
          else:
              raise SystemExit('Production did not update: '+last)
          PY

      - name: Run existing comprehensive production regression
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/atlas-live-qa.js

      - name: Run CRO V2 mobile accessibility analytics and revenue-path QA
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p cro-v2-qa
          node qa/atlas-cro-v2-qa.js

      - name: Run Lighthouse mobile and desktop
        shell: bash
        env:
          URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p cro-v2-qa
          npx lighthouse "$URL" --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=cro-v2-qa/lighthouse-mobile.json
          npx lighthouse "$URL" --quiet --preset=desktop --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=cro-v2-qa/lighthouse-desktop.json
          node - <<'JS'
          const fs=require('fs');
          const out={};
          for(const mode of ['mobile','desktop']){
            const j=JSON.parse(fs.readFileSync(`cro-v2-qa/lighthouse-${mode}.json`));
            const c=j.categories,a=j.audits;
            out[mode]={performance:Math.round(c.performance.score*100),accessibility:Math.round(c.accessibility.score*100),bestPractices:Math.round(c['best-practices'].score*100),seo:Math.round(c.seo.score*100),FCP:a['first-contentful-paint']?.displayValue,LCP:a['largest-contentful-paint']?.displayValue,TBT:a['total-blocking-time']?.displayValue,CLS:a['cumulative-layout-shift']?.displayValue,INP:a['interaction-to-next-paint']?.displayValue||null};
            console.log('LIGHTHOUSE_FINAL '+mode+' '+JSON.stringify(out[mode]));
          }
          fs.writeFileSync('cro-v2-qa/lighthouse-summary.json',JSON.stringify(out,null,2));
          if(out.mobile.accessibility<95||out.mobile.seo<95||out.desktop.accessibility<95||out.desktop.seo<95)process.exit(2);
          JS

      - name: Upload final QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-cro-v2-final-evidence
          path: cro-v2-qa/
          retention-days: 30
