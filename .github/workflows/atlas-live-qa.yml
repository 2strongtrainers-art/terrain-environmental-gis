name: Atlas Live Chromium QA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "atlas-bundle.html"
      - "atlas-build-report.json"
      - "qa/atlas-live-qa.js"
      - ".github/workflows/atlas-live-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run live Atlas click-through QA
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
        run: node qa/atlas-live-qa.js

      - name: Verify final live heading polish
        env:
          ATLAS_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/atlas/
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const r = await page.goto(process.env.ATLAS_URL,{waitUntil:'networkidle',timeout:60000});
            if (!r || r.status() !== 200) throw new Error(`Live Atlas HTTP ${r ? r.status() : 'no response'}`);
            await page.waitForFunction(()=>document.querySelector('#statIndexed')?.textContent?.includes('1,834'));
            const heading = await page.locator('#view-home .sectionhead h2').first().innerText();
            if (heading !== 'What is the Digital Atlas?') throw new Error(`Unexpected heading: ${heading}`);
            console.log(`PASS | Final live heading polish | ${heading}`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Upload QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-live-chromium-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
