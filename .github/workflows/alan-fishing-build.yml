name: Build Alan Fishing Escape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-build.yml'
      - '.alan8.part*'
      - '.alan-premium-v11.py'
      - '.alan-final-v12.py'
      - 'alan-fishing-escape/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply premium 8-plus gameplay, tackle HUD, and final angler polish
        shell: bash
        run: |
          set -euo pipefail
          cat .alan8.part00 .alan8.part01 .alan8.part02 .alan8.part03 .alan8.part04 > /tmp/alan8.b64
          test "$(wc -c < /tmp/alan8.b64)" -eq 18180
          test "$(sha256sum /tmp/alan8.b64 | cut -d' ' -f1)" = "915118832e66facd32d54530ee477048f9b552907b77e3dafca991b6085ebad0"
          base64 -d /tmp/alan8.b64 | gzip -d > /tmp/alan-eight-plus.py
          test "$(sha256sum /tmp/alan-eight-plus.py | cut -d' ' -f1)" = "8cdfb8f07e3adc350491dbdbb97065887a09272764bd4353616da87b3ad7df1c"
          python -m py_compile /tmp/alan-eight-plus.py
          python /tmp/alan-eight-plus.py
          python .alan-premium-v11.py
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('alan-fishing-escape/index.html')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ("avatar.position.set(playerPos.x,gy,playerPos.z);","avatar.position.set(playerPos.x,gy+.19,playerPos.z);"),
            ("if(avatarShadow){avatarShadow.position.set(avatar.position.x,avatar.position.y+.015,avatar.position.z);avatarShadow.material.opacity=state.inBoat?.16:.5;}","if(avatarShadow){avatarShadow.visible=!state.inBoat;if(!state.inBoat)avatarShadow.position.set(avatar.position.x,groundHeightAt(avatar.position.x,avatar.position.z)+.018,avatar.position.z);avatarShadow.material.opacity=.5;}"),
            ("bobber.position.set(0,.1,30);landFish();return true;","bobber.position.set(0,.1,42);landFish();return true;"),
            ("catchAnim={t:0,duration:2.15,start:fish.position.clone(),fish:f,recorded:false};","catchAnim={t:0,duration:1.75,start:fish.position.clone(),fish:f,recorded:false,startedAt:performance.now()};"),
            ("catchAnim.t+=dt;const p=THREE.MathUtils.clamp(catchAnim.t/catchAnim.duration,0,1);","catchAnim.t=Math.max(catchAnim.t+dt,(performance.now()-(catchAnim.startedAt||performance.now()))/1000);const p=THREE.MathUtils.clamp(catchAnim.t/catchAnim.duration,0,1);"),
            ("new THREE.SphereGeometry(.62,22,14)","new THREE.SphereGeometry(.62,state.mobile?16:22,state.mobile?10:14)"),
            ("new THREE.SphereGeometry(.55,18,10)","new THREE.SphereGeometry(.55,state.mobile?14:18,state.mobile?8:10)"),
            ("for(let i=0;i<8;i++){for(const side of [-1,1])","for(let i=0;i<(state.mobile?4:8);i++){for(const side of [-1,1])")
          ]
          for old,new in pairs:
            if new not in s and old in s:s=s.replace(old,new,1)
          audit_old="quality:state.quality,fps:state.fps})"
          audit_new="quality:state.quality,fps:state.fps,fishing:state.fishing,landingT:catchAnim?.t||0})"
          if audit_new not in s and audit_old in s:s=s.replace(audit_old,audit_new,1)
          settings_lure='<div class="setting-row"><span>Lure</span><button id="lure-toggle" class="secondary small">SPOON</button></div>'
          hud_anchor='<button id="log-btn" class="icon-btn log-btn" aria-label="Catch log">🐟 <span id="log-count">0</span></button>'
          hud_lure='<button id="lure-toggle" class="icon-btn tackle-btn" aria-label="Change fishing tackle">SPOON</button>'
          if hud_lure not in s:
            if settings_lure not in s or hud_anchor not in s: raise SystemExit('tackle HUD signature missing')
            s=s.replace(settings_lure,'',1);s=s.replace(hud_anchor,hud_anchor+'\n      '+hud_lure,1)
          tackle_css=".tackle-btn{top:calc(max(10px,env(safe-area-inset-top)) + 94px);width:62px;height:34px;right:max(10px,env(safe-area-inset-right));font-size:9px;letter-spacing:.04em;color:#f5d89f;background:rgba(7,21,18,.72)}"
          if tackle_css not in s:s=s.replace('</style>',tackle_css+'\n</style>',1)
          tutorial_old='<div><b>CAST / REEL</b><span>Fish zones + manage line tension</span></div>'
          tutorial_new='<div><b>CAST / REEL</b><span>Fish zones + manage line tension • tackle button top-right</span></div>'
          if tutorial_new not in s and tutorial_old in s:s=s.replace(tutorial_old,tutorial_new,1)
          if '/* STABLE_LANDING_V12 */' not in s:s=s.replace('/* PREMIUM_RELEASE_V11 */','/* PREMIUM_RELEASE_V11 */\n/* STABLE_LANDING_V12 */',1)
          if '/* TACKLE_HUD_V13 */' not in s:s=s.replace('/* STABLE_LANDING_V12 */','/* STABLE_LANDING_V12 */\n/* TACKLE_HUD_V13 */',1)
          if '<!-- visual-polish-v12 -->' not in s:s=s.replace('</head>','<!-- visual-polish-v12 -->\n</head>',1)
          if '<!-- tackle-hud-v13 -->' not in s:s=s.replace('</head>','<!-- tackle-hud-v13 -->\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          python .alan-final-v12.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('alan-fishing-escape/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module missing')
          Path('/tmp/alan-game.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/alan-game.mjs
          grep -F '8PLUS_RELEASE_V10' alan-fishing-escape/index.html >/dev/null
          grep -F 'PREMIUM_RELEASE_V11' alan-fishing-escape/index.html >/dev/null
          grep -F 'STABLE_LANDING_V12' alan-fishing-escape/index.html >/dev/null
          grep -F 'TACKLE_HUD_V13' alan-fishing-escape/index.html >/dev/null
          grep -F 'FINAL_8PLUS_V12' alan-fishing-escape/index.html >/dev/null
          grep -F 'class="icon-btn tackle-btn"' alan-fishing-escape/index.html >/dev/null
          grep -F "fisherPack.name='fisher-pack'" alan-fishing-escape/index.html >/dev/null
          grep -F 'fisherGear:' alan-fishing-escape/index.html >/dev/null
          grep -F 'landingRef=catchAnim' alan-fishing-escape/index.html >/dev/null
          test "$(grep -o 'id="lure-toggle"' alan-fishing-escape/index.html | wc -l)" -eq 1
          grep -F 'startedAt:performance.now()' alan-fishing-escape/index.html >/dev/null
          grep -F 'landingT:catchAnim?.t||0' alan-fishing-escape/index.html >/dev/null
          sed -E -i 's/alan-fishing-escape-v[0-9]+/alan-fishing-escape-v14/g' alan-fishing-escape/sw.js
          grep -F 'alan-fishing-escape-v14' alan-fishing-escape/sw.js >/dev/null

      - name: Commit verified premium v14 build to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape/index.html alan-fishing-escape/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Finish Fishing Escape premium angler v14'
            git push
          else
            echo 'Premium v14 source already current.'
          fi

      - name: Deploy verified build to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/alan-gh-pages
          git worktree add --detach /tmp/alan-gh-pages origin/gh-pages
          mkdir -p /tmp/alan-gh-pages/alan-fishing-escape
          cp alan-fishing-escape/index.html /tmp/alan-gh-pages/alan-fishing-escape/index.html
          cp alan-fishing-escape/play.html /tmp/alan-gh-pages/alan-fishing-escape/play.html
          cp alan-fishing-escape/manifest.webmanifest /tmp/alan-gh-pages/alan-fishing-escape/manifest.webmanifest
          cp alan-fishing-escape/sw.js /tmp/alan-gh-pages/alan-fishing-escape/sw.js
          cd /tmp/alan-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Fishing Escape premium angler v14'
            git push origin HEAD:gh-pages
          else
            echo 'Pages already current.'
          fi