name: Build Alan Fishing Escape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-build.yml'
      - '.alan-visual-perf-v17.py'
      - '.alan-final-all8-v18.py'
      - '.alan-action-benchmark-v19.py'
      - 'alan-fishing-escape/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v19 final visual, performance and benchmark pass
        shell: bash
        run: |
          set -euo pipefail
          python .alan-visual-perf-v17.py
          python .alan-final-all8-v18.py
          python .alan-action-benchmark-v19.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('alan-fishing-escape/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module missing')
          Path('/tmp/alan-game.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/alan-game.mjs
          grep -F '8PLUS_RELEASE_V10' alan-fishing-escape/index.html >/dev/null
          grep -F 'FINAL_ALL8_V18' alan-fishing-escape/index.html >/dev/null
          grep -F 'ACTION_BENCHMARK_V19' alan-fishing-escape/index.html >/dev/null
          grep -F 'benchmarkAction:benchmarkActionRender' alan-fishing-escape/index.html >/dev/null
          grep -F "m.name='natural-ridgeline'" alan-fishing-escape/index.html >/dev/null
          grep -F "boatBody.name='tapered-fishing-hull'" alan-fishing-escape/index.html >/dev/null
          grep -F "vestPanel.name='angler-detail'" alan-fishing-escape/index.html >/dev/null
          grep -F "const cap=mode==='action'?.72:1.18" alan-fishing-escape/index.html >/dev/null
          sed -E -i 's/alan-fishing-escape-v[0-9]+/alan-fishing-escape-v19/g' alan-fishing-escape/sw.js
          grep -F 'alan-fishing-escape-v19' alan-fishing-escape/sw.js >/dev/null

      - name: Commit verified v19 source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape/index.html alan-fishing-escape/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Add Fishing Escape action performance benchmark v19'
            git push
          else
            echo 'Fishing Escape v19 source already current.'
          fi

      - name: Deploy verified v19 build to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/alan-gh-pages
          git worktree add --detach /tmp/alan-gh-pages origin/gh-pages
          mkdir -p /tmp/alan-gh-pages/alan-fishing-escape
          cp alan-fishing-escape/index.html /tmp/alan-gh-pages/alan-fishing-escape/index.html
          cp alan-fishing-escape/play.html /tmp/alan-gh-pages/alan-fishing-escape/play.html
          cp alan-fishing-escape/manifest.webmanifest /tmp/alan-gh-pages/alan-fishing-escape/manifest.webmanifest
          cp alan-fishing-escape/sw.js /tmp/alan-gh-pages/alan-fishing-escape/sw.js
          cd /tmp/alan-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Fishing Escape benchmark v19'
            git push origin HEAD:gh-pages
          else
            echo 'Pages already current.'
          fi