name: Build Alan Fishing Escape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-build.yml'
      - 'alan-fishing-escape/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify realistic visuals v22
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('alan-fishing-escape/index.html').read_text(encoding='utf-8')
          module = re.search(r'<script type="module">(.*?)</script>', source, re.S)
          if not module:
              raise SystemExit('inline game module missing')
          Path('/tmp/alan-game.mjs').write_text(module.group(1), encoding='utf-8')
          PY
          node --check /tmp/alan-game.mjs
          node --check alan-fishing-escape/visuals-v22.js
          test -s alan-fishing-escape/assets/cascade-dawn-panorama-v22b.png
          grep -F "const RELEASE_ID='REALISM_V22'" alan-fishing-escape/index.html >/dev/null
          grep -F "from './visuals-v22.js?v=22.2'" alan-fishing-escape/index.html >/dev/null
          grep -F 'benchmarkAction:benchmarkActionRender' alan-fishing-escape/index.html >/dev/null
          grep -F "boatBody.name='tapered-fishing-hull'" alan-fishing-escape/index.html >/dev/null
          grep -F "vestPanel.name='angler-detail'" alan-fishing-escape/index.html >/dev/null
          grep -F 'mountainGroup.visible=false' alan-fishing-escape/index.html >/dev/null
          grep -F 'alan-fishing-escape-v22' alan-fishing-escape/sw.js >/dev/null
          grep -F "'./visuals-v22.js'" alan-fishing-escape/sw.js >/dev/null
          grep -F "'./assets/cascade-dawn-panorama-v22b.png'" alan-fishing-escape/sw.js >/dev/null

      - name: Deploy verified v22 build to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/alan-gh-pages
          git worktree add --detach /tmp/alan-gh-pages origin/gh-pages
          mkdir -p /tmp/alan-gh-pages/alan-fishing-escape
          cp -R alan-fishing-escape/. /tmp/alan-gh-pages/alan-fishing-escape/
          cd /tmp/alan-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Fishing Escape realistic visuals v22'
            git push origin HEAD:gh-pages
          else
            echo 'Pages already current.'
          fi
