name: Build Alan Fishing Escape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify live graphics build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('alan-fishing-escape/index.html')
          s = p.read_text(encoding='utf-8')
          bad = "const mistShader=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,fog:true,"
          good = "const mistShader=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,fog:false,"
          if bad in s:
              s = s.replace(bad, good, 1)
              p.write_text(s, encoding='utf-8')
          elif good not in s:
              raise SystemExit('mist shader signature not found')
          PY
          echo 'b74c0d4de90b55f921d4055ac918281a769fccb612eb4fcb86e48146ff0aa6c3  alan-fishing-escape/index.html' | sha256sum -c -
          sed -i "s/alan-fishing-escape-v5/alan-fishing-escape-v6/g" alan-fishing-escape/sw.js
          grep -F "fog:false" alan-fishing-escape/index.html >/dev/null
          grep -F "alan-fishing-escape-v6" alan-fishing-escape/sw.js >/dev/null

      - name: Commit fixed game to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape/index.html alan-fishing-escape/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Alan Fishing Escape mist rendering'
            git push
          else
            echo 'Main game already fixed.'
          fi

      - name: Deploy fixed game to GitHub Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/alan-gh-pages
          git worktree add --detach /tmp/alan-gh-pages origin/gh-pages
          mkdir -p /tmp/alan-gh-pages/alan-fishing-escape
          cp alan-fishing-escape/index.html /tmp/alan-gh-pages/alan-fishing-escape/index.html
          cp alan-fishing-escape/play.html /tmp/alan-gh-pages/alan-fishing-escape/play.html
          cp alan-fishing-escape/manifest.webmanifest /tmp/alan-gh-pages/alan-fishing-escape/manifest.webmanifest
          cp alan-fishing-escape/sw.js /tmp/alan-gh-pages/alan-fishing-escape/sw.js
          cd /tmp/alan-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Alan Fishing Escape mist fix v6'
            git push origin HEAD:gh-pages
          else
            echo 'GitHub Pages game already fixed.'
          fi
