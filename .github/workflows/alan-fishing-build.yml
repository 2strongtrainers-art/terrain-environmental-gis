name: Build Alan Fishing Escape

on:
  push:
    branches: [main]
    paths:
      - '.alan-build-v5/**'
      - '.github/workflows/alan-fishing-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble verified game build
        shell: bash
        run: |
          set -euo pipefail
          cat .alan-build-v5/part*.txt > /tmp/alan-fishing-escape.b64
          echo 'ce7a4b4f52f372ca935f06bc5781c60b1707c08bb01d560ce2219ae924fac757  /tmp/alan-fishing-escape.b64' | sha256sum -c -
          base64 -d /tmp/alan-fishing-escape.b64 | gzip -d > alan-fishing-escape/index.html
          echo '9627ef6f4fa913dd0e80a90d58fbee2bb264bc98c3fd517641a08f314b940e57  alan-fishing-escape/index.html' | sha256sum -c -

          cat > alan-fishing-escape/manifest.webmanifest <<'EOF'
          {
            "name": "Alan Kaplan’s Fishing Escape",
            "short_name": "Fishing Escape",
            "start_url": "./",
            "display": "fullscreen",
            "background_color": "#0b1716",
            "theme_color": "#0f241f",
            "orientation": "landscape"
          }
          EOF

          cat > alan-fishing-escape/sw.js <<'EOF'
          const CACHE='alan-fishing-escape-v5';
          const CORE=['./','./index.html','./manifest.webmanifest'];
          const THREE='https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js';
          self.addEventListener('install',event=>{self.skipWaiting();event.waitUntil((async()=>{const cache=await caches.open(CACHE);await cache.addAll(CORE);try{await cache.add(THREE);}catch{}})())});
          self.addEventListener('activate',event=>{event.waitUntil((async()=>{await self.clients.claim();const keys=await caches.keys();await Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))} )())});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith((async()=>{const cached=await caches.match(event.request);if(cached)return cached;try{const response=await fetch(event.request);if(response&&(response.ok||response.type==='opaque')){const cache=await caches.open(CACHE);cache.put(event.request,response.clone()).catch(()=>{})}return response}catch{if(event.request.mode==='navigate'){const shell=await caches.match('./index.html');if(shell)return shell}return new Response('Offline resource unavailable',{status:503,statusText:'Offline'})}})())});
          EOF

          cat > alan-fishing-escape/play.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=./"><title>Alan Kaplan’s Fishing Escape</title></head><body><script>location.replace('./');</script><p><a href="./">Play Alan Kaplan’s Fishing Escape</a></p></body></html>
          EOF

      - name: Commit upgraded game to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape/index.html alan-fishing-escape/play.html alan-fishing-escape/manifest.webmanifest alan-fishing-escape/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Upgrade Alan Fishing Escape graphics'
            git push
          else
            echo 'Main build already current.'
          fi

      - name: Deploy upgraded game to GitHub Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/alan-gh-pages
          git worktree add --detach /tmp/alan-gh-pages origin/gh-pages
          mkdir -p /tmp/alan-gh-pages/alan-fishing-escape
          cp alan-fishing-escape/index.html /tmp/alan-gh-pages/alan-fishing-escape/index.html
          cp alan-fishing-escape/play.html /tmp/alan-gh-pages/alan-fishing-escape/play.html
          cp alan-fishing-escape/manifest.webmanifest /tmp/alan-gh-pages/alan-fishing-escape/manifest.webmanifest
          cp alan-fishing-escape/sw.js /tmp/alan-gh-pages/alan-fishing-escape/sw.js
          cd /tmp/alan-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Alan Fishing Escape visual overhaul'
            git push origin HEAD:gh-pages
          else
            echo 'GitHub Pages build already current.'
          fi
