name: Build Alan Fishing Escape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-build.yml'
      - '.alan-third-person.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert game to third person and verify
        shell: bash
        run: |
          set -euo pipefail
          python .alan-third-person.py
          node --check /tmp/alan-game.mjs
          grep -F "alan-avatar" alan-fishing-escape/index.html >/dev/null
          grep -F "avatarRodAnchor.add(rodGroup)" alan-fishing-escape/index.html >/dev/null
          grep -F "camera.position.lerp(tmpV2.set(0,2.75,distance)" alan-fishing-escape/index.html >/dev/null
          sed -i "s/alan-fishing-escape-v8/alan-fishing-escape-v9/g" alan-fishing-escape/sw.js
          grep -F "alan-fishing-escape-v9" alan-fishing-escape/sw.js >/dev/null

      - name: Commit third-person upgrade to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape/index.html alan-fishing-escape/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Make Alan Fishing Escape third person'
            git push
          else
            echo 'Third-person build already current.'
          fi

      - name: Deploy third-person upgrade to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/alan-gh-pages
          git worktree add --detach /tmp/alan-gh-pages origin/gh-pages
          mkdir -p /tmp/alan-gh-pages/alan-fishing-escape
          cp alan-fishing-escape/index.html /tmp/alan-gh-pages/alan-fishing-escape/index.html
          cp alan-fishing-escape/play.html /tmp/alan-gh-pages/alan-fishing-escape/play.html
          cp alan-fishing-escape/manifest.webmanifest /tmp/alan-gh-pages/alan-fishing-escape/manifest.webmanifest
          cp alan-fishing-escape/sw.js /tmp/alan-gh-pages/alan-fishing-escape/sw.js
          cd /tmp/alan-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Alan Fishing Escape third-person v9'
            git push origin HEAD:gh-pages
          else
            echo 'GitHub Pages third-person build already current.'
          fi
