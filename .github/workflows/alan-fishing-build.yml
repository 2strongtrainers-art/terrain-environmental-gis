name: Build Alan Fishing Escape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-build.yml'
      - '.alan8.part*'
      - 'alan-fishing-escape/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 8-plus upgrade and verify
        shell: bash
        run: |
          set -euo pipefail
          cat .alan8.part00 .alan8.part01 .alan8.part02 .alan8.part03 .alan8.part04 > /tmp/alan8.b64
          test "$(wc -c < /tmp/alan8.b64)" -eq 18180
          test "$(sha256sum /tmp/alan8.b64 | cut -d' ' -f1)" = "915118832e66facd32d54530ee477048f9b552907b77e3dafca991b6085ebad0"
          base64 -d /tmp/alan8.b64 | gzip -d > /tmp/alan-eight-plus.py
          test "$(sha256sum /tmp/alan-eight-plus.py | cut -d' ' -f1)" = "8cdfb8f07e3adc350491dbdbb97065887a09272764bd4353616da87b3ad7df1c"
          python -m py_compile /tmp/alan-eight-plus.py
          python /tmp/alan-eight-plus.py
          node --check /tmp/alan-game.mjs
          grep -F '8PLUS_RELEASE_V10' alan-fishing-escape/index.html >/dev/null
          grep -F 'window.__ALAN_GAME__' alan-fishing-escape/index.html >/dev/null
          grep -F 'makePineCrown' alan-fishing-escape/index.html >/dev/null
          grep -F 'speciesWeight' alan-fishing-escape/index.html >/dev/null
          sed -E -i 's/alan-fishing-escape-v[0-9]+/alan-fishing-escape-v10/g' alan-fishing-escape/sw.js
          grep -F 'alan-fishing-escape-v10' alan-fishing-escape/sw.js >/dev/null

      - name: Commit verified 8-plus build to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape/index.html alan-fishing-escape/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Upgrade Fishing Escape to 8-plus release'
            git push
          else
            echo '8-plus source already current.'
          fi

      - name: Deploy verified build to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/alan-gh-pages
          git worktree add --detach /tmp/alan-gh-pages origin/gh-pages
          mkdir -p /tmp/alan-gh-pages/alan-fishing-escape
          cp alan-fishing-escape/index.html /tmp/alan-gh-pages/alan-fishing-escape/index.html
          cp alan-fishing-escape/play.html /tmp/alan-gh-pages/alan-fishing-escape/play.html
          cp alan-fishing-escape/manifest.webmanifest /tmp/alan-gh-pages/alan-fishing-escape/manifest.webmanifest
          cp alan-fishing-escape/sw.js /tmp/alan-gh-pages/alan-fishing-escape/sw.js
          cd /tmp/alan-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Fishing Escape 8-plus v10'
            git push origin HEAD:gh-pages
          else
            echo 'Pages already current.'
          fi