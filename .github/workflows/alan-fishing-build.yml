name: Build Alan Fishing Escape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-build.yml'
      - '.alan8.part*'
      - '.alan-premium-v11.py'
      - 'alan-fishing-escape/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 8-plus upgrade and premium visual polish
        shell: bash
        run: |
          set -euo pipefail
          cat .alan8.part00 .alan8.part01 .alan8.part02 .alan8.part03 .alan8.part04 > /tmp/alan8.b64
          test "$(wc -c < /tmp/alan8.b64)" -eq 18180
          test "$(sha256sum /tmp/alan8.b64 | cut -d' ' -f1)" = "915118832e66facd32d54530ee477048f9b552907b77e3dafca991b6085ebad0"
          base64 -d /tmp/alan8.b64 | gzip -d > /tmp/alan-eight-plus.py
          test "$(sha256sum /tmp/alan-eight-plus.py | cut -d' ' -f1)" = "8cdfb8f07e3adc350491dbdbb97065887a09272764bd4353616da87b3ad7df1c"
          python -m py_compile /tmp/alan-eight-plus.py
          python /tmp/alan-eight-plus.py
          python .alan-premium-v11.py
          python - <<'PY'
          from pathlib import Path
          p=Path('alan-fishing-escape/index.html')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ("forceLanding:()=>{if(state.fishing==='LANDING')return;","forceLanding:()=>{if(state.fishing==='LANDING')return false;"),
            ("bobber.position.set(0,.1,30);landFish();}};","bobber.position.set(0,.1,30);landFish();return true;}};"),
            ("avatar.position.set(playerPos.x,gy,playerPos.z);","avatar.position.set(playerPos.x,gy+.19,playerPos.z);"),
            ("if(avatarShadow){avatarShadow.position.set(avatar.position.x,avatar.position.y+.015,avatar.position.z);avatarShadow.material.opacity=state.inBoat?.16:.5;}","if(avatarShadow){avatarShadow.visible=!state.inBoat;if(!state.inBoat)avatarShadow.position.set(avatar.position.x,groundHeightAt(avatar.position.x,avatar.position.z)+.018,avatar.position.z);avatarShadow.material.opacity=.5;}"),
            ("renderer.toneMappingExposure = 1.16;","renderer.toneMappingExposure = 1.27;"),
            ("const ambient = new THREE.AmbientLight(0x9fb0a8, .32);","const ambient = new THREE.AmbientLight(0xb3c0b6, .46);"),
            ("const fill = new THREE.DirectionalLight(0x8fb9d3,.48);","const fill = new THREE.DirectionalLight(0x9fc5d7,.62);"),
            ("color:0x61705a,roughness:.98","color:0x76856c,roughness:.98")
          ]
          for old,new in pairs:
            if new not in s and old in s:s=s.replace(old,new,1)
          anchor="avatar.add(vest);\n  const collar="
          if "alan-fishing-pack" not in s and anchor in s:
            s=s.replace(anchor,"avatar.add(vest);const pack=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.11),capMat);pack.name='alan-fishing-pack';pack.position.set(0,1.38,.31);pack.rotation.x=-.03;avatar.add(pack);\n  const collar=",1)
          if '<!-- visual-polish-v11 -->' not in s:s=s.replace('</head>','<!-- visual-polish-v11 -->\n</head>',1)
          p.write_text(s,encoding='utf-8')
          import re
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m:raise SystemExit('module missing')
          Path('/tmp/alan-game.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/alan-game.mjs
          grep -F '8PLUS_RELEASE_V10' alan-fishing-escape/index.html >/dev/null
          grep -F 'PREMIUM_RELEASE_V11' alan-fishing-escape/index.html >/dev/null
          grep -F 'alan-premium-avatar' alan-fishing-escape/index.html >/dev/null
          grep -F 'GLTFLoader' alan-fishing-escape/index.html >/dev/null
          grep -F 'visual-polish-v11' alan-fishing-escape/index.html >/dev/null
          grep -F 'return true;}};' alan-fishing-escape/index.html >/dev/null
          sed -E -i 's/alan-fishing-escape-v[0-9]+/alan-fishing-escape-v11/g' alan-fishing-escape/sw.js
          grep -F 'alan-fishing-escape-v11' alan-fishing-escape/sw.js >/dev/null

      - name: Commit verified premium build to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape/index.html alan-fishing-escape/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Upgrade Fishing Escape premium v11'
            git push
          else
            echo 'Premium source already current.'
          fi

      - name: Deploy verified build to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/alan-gh-pages
          git worktree add --detach /tmp/alan-gh-pages origin/gh-pages
          mkdir -p /tmp/alan-gh-pages/alan-fishing-escape
          cp alan-fishing-escape/index.html /tmp/alan-gh-pages/alan-fishing-escape/index.html
          cp alan-fishing-escape/play.html /tmp/alan-gh-pages/alan-fishing-escape/play.html
          cp alan-fishing-escape/manifest.webmanifest /tmp/alan-gh-pages/alan-fishing-escape/manifest.webmanifest
          cp alan-fishing-escape/sw.js /tmp/alan-gh-pages/alan-fishing-escape/sw.js
          cd /tmp/alan-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Fishing Escape premium v11'
            git push origin HEAD:gh-pages
          else
            echo 'Pages already current.'
          fi