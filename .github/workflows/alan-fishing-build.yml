name: Build Alan Fishing Escape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve and verify opening composition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('alan-fishing-escape/index.html')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ("let yaw = Math.PI, pitch = -0.08, boatYaw = 0.22;","let yaw = 0, pitch = -0.045, boatYaw = 0.22;"),
            ("playerPos.set(0,1.72,53);boat.position.set(7.5,.45,34);","playerPos.set(0,1.72,53);yaw=0;pitch=-0.045;boat.position.set(7.5,.45,34);")
          ]
          changed=0
          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new,1); changed+=1
              elif new not in s:
                  raise SystemExit('Expected composition signature missing: '+old[:45])
          p.write_text(s,encoding='utf-8')
          module=s.split('<script type="module">',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/alan-game.mjs').write_text(module,encoding='utf-8')
          print('composition replacements',changed)
          PY
          node --check /tmp/alan-game.mjs
          grep -F "let yaw = 0, pitch = -0.045" alan-fishing-escape/index.html >/dev/null
          sed -i "s/alan-fishing-escape-v6/alan-fishing-escape-v7/g" alan-fishing-escape/sw.js
          grep -F "alan-fishing-escape-v7" alan-fishing-escape/sw.js >/dev/null

      - name: Commit composition upgrade to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape/index.html alan-fishing-escape/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Open Fishing Escape on cinematic lake view'
            git push
          else
            echo 'Composition already current.'
          fi

      - name: Deploy composition upgrade to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/alan-gh-pages
          git worktree add --detach /tmp/alan-gh-pages origin/gh-pages
          mkdir -p /tmp/alan-gh-pages/alan-fishing-escape
          cp alan-fishing-escape/index.html /tmp/alan-gh-pages/alan-fishing-escape/index.html
          cp alan-fishing-escape/play.html /tmp/alan-gh-pages/alan-fishing-escape/play.html
          cp alan-fishing-escape/manifest.webmanifest /tmp/alan-gh-pages/alan-fishing-escape/manifest.webmanifest
          cp alan-fishing-escape/sw.js /tmp/alan-gh-pages/alan-fishing-escape/sw.js
          cd /tmp/alan-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-fishing-escape
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Fishing Escape cinematic lake view v7'
            git push origin HEAD:gh-pages
          else
            echo 'GitHub Pages composition already current.'
          fi
