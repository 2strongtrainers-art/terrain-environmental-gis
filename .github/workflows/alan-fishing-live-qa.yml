name: Alan Fishing Escape Live QA
# Visual overhaul v5 verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test public iPhone experience
        shell: bash
        env:
          GAME_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/alan-fishing-escape/
        run: |
          set -euo pipefail
          echo 'HTTP response headers:'
          curl -fsSIL --max-time 30 "$GAME_URL?curlqa=$(date +%s)" | sed -n '1,20p'
          echo 'Public source fingerprint:'
          curl -fsSL --max-time 30 "$GAME_URL?sourceqa=$(date +%s)" | grep -Eo 'Alan Kaplan[^<]{0,80}|id="play-btn"|catch-log|manifest.webmanifest' | head -20 || true
          cat > /tmp/alan-live-qa.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const context = await browser.newContext({viewport:{width:844,height:390},deviceScaleFactor:2,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
            const page = await context.newPage();
            const fatal=[];
            page.on('pageerror',e=>fatal.push('pageerror: '+e.message));
            page.on('console',m=>{ if(m.type()==='error' && !/favicon/i.test(m.text())) fatal.push('console: '+m.text()); });
            const url=process.env.GAME_URL+'?qa='+Date.now();
            const response=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            if(!response || !response.ok()) throw new Error('Game page HTTP failure: '+(response&&response.status()));
            const before=await page.evaluate(()=>({url:location.href,title:document.title,hasPlay:!!document.querySelector('#play-btn'),hasCanvas:!!document.querySelector('#game'),hasCatchLog:!!document.querySelector('#catch-log')}));
            console.log('PUBLIC_PAGE_DEBUG',JSON.stringify(before));
            await page.waitForSelector('#play-btn',{state:'visible',timeout:15000});
            await page.click('#play-btn');
            await page.waitForSelector('#tutorial:not(.hidden)',{timeout:10000});
            await page.click('#tutorial-go');
            await page.waitForSelector('#hud:not(.hidden)',{timeout:10000});
            await page.waitForTimeout(2500);
            const result=await page.evaluate(()=>({
              title:document.title,
              canvas:!!document.querySelector('#game'),
              canvasW:document.querySelector('#game')?.width||0,
              canvasH:document.querySelector('#game')?.height||0,
              hudVisible:!document.querySelector('#hud')?.classList.contains('hidden'),
              controlsVisible:!document.querySelector('#controls')?.classList.contains('hidden'),
              fallbackVisible:document.querySelector('#webgl-fallback')?!document.querySelector('#webgl-fallback').classList.contains('hidden'):false,
              catchLog:!!document.querySelector('#catch-log')
            }));
            console.log('LIVE_QA_RESULT',JSON.stringify(result));
            if(result.title!=="Alan Kaplan’s Fishing Escape") throw new Error('Unexpected title');
            if(!result.canvas || result.canvasW<300 || result.canvasH<200) throw new Error('Canvas did not initialize');
            if(!result.hudVisible || !result.controlsVisible) throw new Error('iPhone controls/HUD did not enter gameplay');
            if(!result.catchLog) throw new Error('Catch log UI missing');
            if(result.fallbackVisible) throw new Error('WebGL fallback is visible');
            const meaningfulFatal=fatal.filter(x=>!/Failed to load resource.*favicon/i.test(x));
            if(meaningfulFatal.length) throw new Error('Runtime errors: '+meaningfulFatal.join(' | '));
            await page.screenshot({path:'alan-fishing-live-qa.png',fullPage:true});
            await browser.close();
            console.log('ALAN_FISHING_LIVE_QA_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/alan-live-qa.cjs

      - name: Upload QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-fishing-live-qa
          path: alan-fishing-live-qa.png
          if-no-files-found: ignore
