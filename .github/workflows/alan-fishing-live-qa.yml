name: Alan Fishing Escape Live QA
# Premium angler v15 final 8-plus release gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test public iPhone gameplay, touch, performance and catch loop
        shell: bash
        env:
          GAME_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/alan-fishing-escape/
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 20); do
            body="$(curl -fsSL --max-time 30 "$GAME_URL?ready=$(date +%s)-$i" || true)"
            if printf '%s' "$body" | grep -F 'HUD_TOUCH_PRIORITY_V15' >/dev/null && printf '%s' "$body" | grep -F "fisherPack.name='fisher-pack'" >/dev/null; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1
          cat > /tmp/alan-live-qa.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:844,height:390},deviceScaleFactor:2,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
            const page=await context.newPage();
            const fatal=[];
            page.on('pageerror',e=>fatal.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))fatal.push('console: '+m.text())});
            const response=await page.goto(process.env.GAME_URL+'?qa='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            if(!response||!response.ok())throw new Error('HTTP '+(response&&response.status()));
            await page.waitForSelector('#play-btn',{state:'visible',timeout:15000});
            await page.click('#play-btn');
            await page.waitForSelector('#tutorial:not(.hidden)',{timeout:10000});
            await page.click('#tutorial-go');
            await page.waitForSelector('#hud:not(.hidden)',{timeout:10000});
            await page.waitForFunction(()=>{const a=window.__ALAN_GAME__?.audit?.();return a?.premiumAvatar===true&&a?.fisherGear===true;},{timeout:20000});
            await page.waitForTimeout(1800);
            let audit=await page.evaluate(()=>window.__ALAN_GAME__?.audit?.());
            console.log('V15_AUDIT',JSON.stringify(audit));
            if(!audit||audit.release!=='8PLUS_RELEASE_V10')throw new Error('Wrong runtime release '+JSON.stringify(audit));
            if(!audit.avatar||!audit.premiumAvatar||!audit.fisherGear||!audit.rodAttached||!audit.thirdPerson)throw new Error('Premium angler integrity failed '+JSON.stringify(audit));
            if(audit.fps<45)throw new Error('Initial mobile-render FPS below 8-plus gate '+audit.fps);
            const base=await page.evaluate(()=>({title:document.title,canvasW:document.querySelector('#game')?.width||0,canvasH:document.querySelector('#game')?.height||0,hudVisible:!document.querySelector('#hud')?.classList.contains('hidden'),controlsVisible:!document.querySelector('#controls')?.classList.contains('hidden'),fallbackVisible:document.querySelector('#webgl-fallback')?!document.querySelector('#webgl-fallback').classList.contains('hidden'):false,zone:document.querySelector('#zone-chip')?.textContent||'',lure:document.querySelector('#lure-toggle')?.textContent||'',lureVisible:!!(document.querySelector('#lure-toggle')?.offsetWidth&&document.querySelector('#lure-toggle')?.offsetHeight),action:document.querySelector('#action-btn')?.textContent||'',hudZ:getComputedStyle(document.querySelector('#hud')).zIndex}));
            console.log('BASE',JSON.stringify(base));
            if(base.title!=="Alan Kaplan’s Fishing Escape"||base.canvasW<300||base.canvasH<200||!base.hudVisible||!base.controlsVisible||base.fallbackVisible)throw new Error('Base gameplay failed '+JSON.stringify(base));
            if(!base.zone||!base.lure||!base.lureVisible||base.action!=='CAST'||Number(base.hudZ)<15)throw new Error('Strategy/action HUD missing or touch stack wrong '+JSON.stringify(base));
            await page.click('#lure-toggle',{timeout:8000});
            await page.waitForTimeout(180);
            const switched=await page.evaluate(()=>window.__ALAN_GAME__.audit().lure);
            if(switched==='SPOON')throw new Error('Tackle selector did not switch');
            await page.screenshot({path:'alan-fishing-v15-gameplay.png',fullPage:true});
            const forced=await page.evaluate(()=>window.__ALAN_GAME__.forceLanding());
            if(forced!==true)throw new Error('Landing test hook failed: '+forced);
            await page.waitForTimeout(650);
            const during=await page.evaluate(()=>window.__ALAN_GAME__.audit());
            console.log('DURING_LANDING',JSON.stringify(during));
            if(during.fishing!=='LANDING'||during.landingT<=.10)throw new Error('Landing animation did not visibly advance '+JSON.stringify(during));
            await page.screenshot({path:'alan-fishing-v15-landing.png',fullPage:true});
            await page.waitForFunction(()=>{const a=window.__ALAN_GAME__?.audit?.();return a&&a.catches>=1&&a.score>0&&a.fishing==='CAUGHT';},{timeout:5000});
            const after=await page.evaluate(()=>window.__ALAN_GAME__.audit());
            console.log('AFTER_LANDING',JSON.stringify(after));
            if(after.catches<1||after.score<=0||after.fishing!=='CAUGHT')throw new Error('Catch/progression did not complete '+JSON.stringify(after));
            const meaningful=fatal.filter(x=>!/Failed to load resource.*favicon/i.test(x));
            if(meaningful.length)throw new Error('Runtime errors: '+meaningful.join(' | '));
            await browser.close();
            console.log('ALAN_FISHING_V15_QA_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/alan-live-qa.cjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-fishing-live-qa-v15-final
          path: |
            alan-fishing-v15-gameplay.png
            alan-fishing-v15-landing.png
          if-no-files-found: ignore