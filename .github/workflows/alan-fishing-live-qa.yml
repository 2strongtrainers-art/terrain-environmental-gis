name: Alan Fishing Escape Live QA
# 8-plus v10 gameplay verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alan-fishing-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test public iPhone gameplay
        shell: bash
        env:
          GAME_URL: https://2strongtrainers-art.github.io/terrain-environmental-gis/alan-fishing-escape/
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 30 "$GAME_URL?ready=$(date +%s)-$i" | grep -F '8PLUS_RELEASE_V10' >/dev/null; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1
          curl -fsSIL --max-time 30 "$GAME_URL?curlqa=$(date +%s)" | sed -n '1,20p'
          cat > /tmp/alan-live-qa.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:844,height:390},deviceScaleFactor:2,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
            const page=await context.newPage();
            const fatal=[];
            page.on('pageerror',e=>fatal.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))fatal.push('console: '+m.text())});
            const response=await page.goto(process.env.GAME_URL+'?qa='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            if(!response||!response.ok())throw new Error('HTTP '+(response&&response.status()));
            await page.waitForSelector('#play-btn',{state:'visible',timeout:15000});
            await page.click('#play-btn');
            await page.waitForSelector('#tutorial:not(.hidden)',{timeout:10000});
            await page.click('#tutorial-go');
            await page.waitForSelector('#hud:not(.hidden)',{timeout:10000});
            await page.waitForTimeout(3500);
            const audit=await page.evaluate(()=>window.__ALAN_GAME__?.audit?.());
            console.log('V10_AUDIT',JSON.stringify(audit));
            if(!audit)throw new Error('Runtime audit API missing');
            if(audit.release!=='8PLUS_RELEASE_V10')throw new Error('Wrong release '+audit.release);
            if(!audit.avatar||!audit.rodAttached||!audit.thirdPerson)throw new Error('Third-person integrity failed: '+JSON.stringify(audit));
            const base=await page.evaluate(()=>({
              title:document.title,canvasW:document.querySelector('#game')?.width||0,canvasH:document.querySelector('#game')?.height||0,
              hudVisible:!document.querySelector('#hud')?.classList.contains('hidden'),controlsVisible:!document.querySelector('#controls')?.classList.contains('hidden'),
              fallbackVisible:document.querySelector('#webgl-fallback')?!document.querySelector('#webgl-fallback').classList.contains('hidden'):false,
              zone:document.querySelector('#zone-chip')?.textContent||'',lure:document.querySelector('#lure-toggle')?.textContent||''
            }));
            console.log('BASE',JSON.stringify(base));
            if(base.title!=="Alan Kaplan’s Fishing Escape"||base.canvasW<300||base.canvasH<200||!base.hudVisible||!base.controlsVisible||base.fallbackVisible)throw new Error('Base gameplay failed '+JSON.stringify(base));
            if(!base.zone||!base.lure)throw new Error('Strategy HUD missing');
            await page.screenshot({path:'alan-fishing-v10-gameplay.png',fullPage:true});
            const forced=await page.evaluate(()=>window.__ALAN_GAME__.forceLanding());
            if(!forced)throw new Error('Could not force landing sequence');
            await page.waitForTimeout(850);
            await page.screenshot({path:'alan-fishing-v10-landing.png',fullPage:true});
            await page.waitForTimeout(1800);
            const after=await page.evaluate(()=>window.__ALAN_GAME__.audit());
            console.log('AFTER_LANDING',JSON.stringify(after));
            if(after.catches<1||after.score<=0)throw new Error('Catch/progression did not complete '+JSON.stringify(after));
            const meaningful=fatal.filter(x=>!/Failed to load resource.*favicon/i.test(x));
            if(meaningful.length)throw new Error('Runtime errors: '+meaningful.join(' | '));
            await browser.close();
            console.log('ALAN_FISHING_V10_QA_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/alan-live-qa.cjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-fishing-live-qa-v10
          path: |
            alan-fishing-v10-gameplay.png
            alan-fishing-v10-landing.png
          if-no-files-found: ignore